<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毕业成绩单生成器 · 测试页</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 24px;
        display: flex;
        gap: 24px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
    }
    .card {
        background: #fff;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        max-width: 420px;
        width: 100%;
    }
    h1 {
        font-size: 20px;
        font-weight: 900;
        color: #1e293b;
        margin-bottom: 4px;
    }
    .sub {
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 20px;
        font-weight: 600;
    }
    label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #64748b;
        margin: 12px 0 6px;
    }
    input[type=text], input[type=number], textarea, select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        color: #1e293b;
        outline: none;
        transition: border-color .2s;
        background: #fff;
    }
    input:focus, textarea:focus, select:focus { border-color: #667eea; }
    textarea { resize: vertical; min-height: 60px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .btns { display: flex; gap: 12px; margin-top: 20px; }
    button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 900;
        font-family: inherit;
        cursor: pointer;
        transition: transform .1s, opacity .2s;
    }
    button:active { transform: scale(0.96); }
    .primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
    .ghost { background: #f1f5f9; color: #475569; }
    button:hover { opacity: 0.9; }
    .preview-wrap { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    canvas {
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        max-width: 100%;
        height: auto;
        background: #fff;
    }
    .hint { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 600; max-width: 420px; }
</style>
</head>
<body>
<div class="card">
    <h1>🎓 毕业成绩单生成器</h1>
    <div class="sub">测试页 · 调好样式后集成进游戏结局页</div>

    <label>评级</label>
    <select id="rank">
        <option value="SSS">SSS · 清北保送生（金色）</option>
        <option value="SS">SS · 强基破格（银色）</option>
        <option value="S">S · 省队巨佬（铜色）</option>
        <option value="A">A · 尖子生</option>
        <option value="B">B · 中流砥柱</option>
        <option value="C">C · 芸芸众生</option>
        <option value="D">D · 学业危机</option>
        <option value="Z">Z · 家里蹲预备役</option>
    </select>

    <label>称号</label>
    <input type="text" id="title" value="普通高中生" maxlength="20">

    <label>评语</label>
    <textarea id="comment">高一学年结束了。前面的路，以后再来探索吧。</textarea>

    <div class="row">
        <div><label>综合分数</label><input type="number" id="score" value="68" min="0" max="100"></div>
        <div><label>玩家名字</label><input type="text" id="name" value="匿名" maxlength="12"></div>
    </div>
    <div class="row">
        <div><label>学识</label><input type="number" id="knowledge" value="45" min="0" max="150"></div>
        <div><label>心态</label><input type="number" id="mindset" value="62" min="0" max="150"></div>
    </div>
    <div class="row">
        <div><label>健康</label><input type="number" id="health" value="80" min="0" max="150"></div>
        <div><label>金钱</label><input type="number" id="money" value="120" min="-999" max="9999"></div>
    </div>
    <div class="row">
        <div><label>魅力</label><input type="number" id="romance" value="35" min="0" max="150"></div>
        <div><label>效率</label><input type="number" id="efficiency" value="12" min="0" max="30"></div>
    </div>
    <div class="row">
        <div><label>经验</label><input type="number" id="experience" value="28" min="0" max="999"></div>
        <div><label>运气</label><input type="number" id="luck" value="50" min="0" max="150"></div>
    </div>

    <div class="btns">
        <button class="primary" onclick="generate()">生成</button>
        <button class="ghost" onclick="downloadPng()">保存图片</button>
    </div>
</div>

<div class="preview-wrap">
    <canvas id="cv" width="750" height="1000"></canvas>
    <div class="hint">↑ 预览（750×1000）。点击「保存图片」下载 PNG。集成进游戏时，输入改由结局数据自动填充，再加「长按保存」。</div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const FONT = "'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif";

const RANK_COLORS = {
    SSS: { main: '#b45309', light: '#fef3c7', label: 'GOLD' },
    SS:  { main: '#64748b', light: '#f1f5f9', label: 'SILVER' },
    S:   { main: '#b45309', light: '#ffedd5', label: 'BRONZE' },
    A:   { main: '#4f46e5', light: '#e0e7ff', label: 'RANK' },
    B:   { main: '#0d9488', light: '#ccfbf1', label: 'RANK' },
    C:   { main: '#0284c7', light: '#e0f2fe', label: 'RANK' },
    D:   { main: '#ea580c', light: '#ffedd5', label: 'RANK' },
    Z:   { main: '#475569', light: '#e2e8f0', label: 'RANK' }
};

const wrapText = (text, x, y, maxWidth, lineHeight, maxLines) => {
    const chars = [...text];
    const lines = [];
    let line = '';
    for (const ch of chars) {
        if (ctx.measureText(line + ch).width > maxWidth) {
            lines.push(line);
            line = ch;
            if (lines.length >= maxLines) break;
        } else {
            line += ch;
        }
    }
    if (lines.length < maxLines && line) lines.push(line);
    if (lines.length >= maxLines && line && !lines.includes(line)) lines[maxLines - 1] = lines[maxLines - 1].slice(0, -1) + '…';
    lines.slice(0, maxLines).forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
};

const roundRect = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
};

const drawBar = (label, value, max, y, color) => {
    ctx.fillStyle = '#475569';
    ctx.font = `600 20px ${FONT}`;
    ctx.textAlign = 'left';
    ctx.fillText(label, 120, y + 22);
    const barX = 220, barW = 350, barH = 16;
    roundRect(barX, y + 8, barW, barH, 8);
    ctx.fillStyle = '#e2e8f0';
    ctx.fill();
    const pct = Math.max(0, Math.min(1, value / max));
    if (pct > 0) {
        roundRect(barX, y + 8, Math.max(16, barW * pct), barH, 8);
        ctx.fillStyle = color;
        ctx.fill();
    }
    ctx.fillStyle = '#334155';
    ctx.font = `700 20px ${FONT}`;
    ctx.textAlign = 'right';
    ctx.fillText(String(value), barX + barW + 60, y + 24);
};

function generate() {
    const rank = document.getElementById('rank').value;
    const title = document.getElementById('title').value || '普通高中生';
    const comment = document.getElementById('comment').value || '前面的路，以后再来探索吧。';
    const score = Number(document.getElementById('score').value) || 0;
    const name = document.getElementById('name').value || '匿名';
    const rc = RANK_COLORS[rank] || RANK_COLORS.C;
    const today = new Date();
    const dateStr = `${today.getFullYear()} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日`;

    // 背景
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 750, 1000);
    // 顶部渐变条
    const grad = ctx.createLinearGradient(0, 0, 750, 0);
    grad.addColorStop(0, '#667eea');
    grad.addColorStop(1, '#764ba2');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 750, 10);

    // 装饰边框
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 2;
    ctx.strokeRect(28, 28, 694, 944);
    ctx.strokeStyle = '#667eea';
    ctx.lineWidth = 1;
    ctx.strokeRect(38, 38, 674, 924);

    // 校名
    ctx.fillStyle = '#334155';
    ctx.font = `900 44px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('北京八中 · 重开模拟器', 375, 110);
    ctx.fillStyle = '#94a3b8';
    ctx.font = `600 20px ${FONT}`;
    ctx.fillText('GRADUATION REPORT', 375, 145);

    // 分割线
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(120, 170);
    ctx.lineTo(630, 170);
    ctx.stroke();

    // 评级徽章
    ctx.beginPath();
    ctx.arc(375, 275, 85, 0, Math.PI * 2);
    ctx.fillStyle = rc.light;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = rc.main;
    ctx.stroke();
    ctx.fillStyle = rc.main;
    ctx.font = `900 72px ${FONT}`;
    ctx.fillText(rank, 375, 300);
    ctx.font = `700 16px ${FONT}`;
    ctx.fillText(rc.label, 375, 330);

    // 称号 + 名字 + 分数
    ctx.fillStyle = '#0f172a';
    ctx.font = `900 40px ${FONT}`;
    ctx.fillText(title, 375, 420);
    ctx.fillStyle = '#64748b';
    ctx.font = `600 22px ${FONT}`;
    ctx.fillText(`${name} · 综合评分`, 375, 458);
    ctx.fillStyle = '#4f46e5';
    ctx.font = `900 56px ${FONT}`;
    ctx.fillText(String(Math.round(score)), 375, 520);

    // 评语
    ctx.fillStyle = '#475569';
    ctx.font = `500 22px ${FONT}`;
    wrapText(comment, 375, 575, 480, 32, 2);

    // 属性条
    const bars = [
        ['学识', document.getElementById('knowledge').value, 150, '#4f46e5'],
        ['心态', document.getElementById('mindset').value, 150, '#3b82f6'],
        ['健康', document.getElementById('health').value, 150, '#10b981'],
        ['金钱', document.getElementById('money').value, 300, '#f59e0b'],
        ['魅力', document.getElementById('romance').value, 150, '#f43f5e'],
        ['效率', document.getElementById('efficiency').value, 30, '#a855f7'],
        ['经验', document.getElementById('experience').value, 999, '#f97316'],
        ['运气', document.getElementById('luck').value, 150, '#8b5cf6']
    ];
    bars.forEach(([label, v, max, color], i) => {
        drawBar(label, Number(v) || 0, max, 655 + i * 46, color);
    });

    // 底部
    ctx.strokeStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.moveTo(120, 1028 - 108);
    ctx.lineTo(630, 1028 - 108);
    ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    ctx.font = `600 18px ${FONT}`;
    ctx.fillText(`颁发日期：${dateStr}`, 375, 1028 - 80);
    ctx.fillText('八中重开模拟器 · 出品', 375, 1028 - 52);
}

function downloadPng() {
    generate();
    cv.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `八中成绩单-${document.getElementById('rank').value}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, 'image/png');
}

generate();
</script>
</body>
</html>
