
<!DOCTYPE html>
<html lang="zh-CN">
<head><script>
window.addEventListener("error", function(e) { document.body.innerHTML = "<div style='color:red;padding:20px;z-index:9999;position:relative;background:white;'><h1>GLOBAL ERROR</h1><pre>" + (e.error?.stack || e.message) + "</pre></div>"; });
window.addEventListener("unhandledrejection", function(e) { document.body.innerHTML = "<div style='color:red;padding:20px;z-index:9999;position:relative;background:white;'><h1>PROMISE ERROR</h1><pre>" + (e.reason?.stack || e.reason) + "</pre></div>"; });
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八中重开模拟器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f8fafc;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        .animate-slideInRight { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body>

</body>
</html>
